name: Mercedes CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:

      # 1. DOWNLOAD REPOSITORY CODE
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. PYTHON
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. DEPENDENCIES
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ingestion/requirements.txt

      # 4. VERIFY PYTHON ENVIRONMENT
      - name: Verify Python environment
        run: |
          python --version
          python -c "import requests; print('requests OK')"
          python -c "import pandas; print('pandas OK')"
          python -c "import snowflake.connector; print('snowflake connector OK')"

      # 5. PROFILE TEST DATA
      - name: Profile test datasets
        run: |
          python tests/profile_datasets.py --fixtures

      # 6. VALIDATE PYTHON SYNTAX
      - name: Validate Python syntax
        run: |
          python -m compileall -q ingestion scripts tests

      # 7. CHECK PYTHON DEPENDENCIES
      - name: Check Python dependencies
        run: |
          pip check