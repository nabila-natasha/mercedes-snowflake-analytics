name: Mercedes CD

# CONTINUOUS DEPLOYMENT

# This workflow is intentionally NOT triggered automatically
# by every push.

# CI validates the code first.
# CD is manually triggered when we decide that the validated
# version is ready for production.

on:
  # Manual trigger from:
  # GitHub
  #   → Actions
  #   → Mercedes CD
  #   → Run workflow
    workflow_dispatch:

jobs:
    deploy-production: 

        # GitHub Environment
        # Repository → Settings → Environments → production
        # This allows production-specific protection rules.
        environment: production
        
        runs-on: ubuntu-latest

        steps:
            
            # 1. DOWNLOAD REPOSITORY CODE
            - name: Checkout repository
              uses: actions/checkout@v4

            # 2. SET UP PYTHON
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: "3.12"

            # 3. INSTALL PROJECT DEPENDENCIES
            - name: Install dependencies

              run: |
                python -m pip install --upgrade pip
                pip install -r ingestion/requirements.txt

            # 4. GENERATE NHTSA DATA
            - name: Ingest NHTSA data
              env:
                SNOWFLAKE_DATABASE: MERCEDES_PROD
              
              run: |
                python scripts/01_ingest_nhtsa.py

            # 5. LOAD USED CAR DATA INTO SNOWFLAKE
            - name: Load used car data
              env:
                SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
                SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_USER }}
                SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
                SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
                SNOWFLAKE_WAREHOUSE: LOAD_WH
                SNOWFLAKE_DATABASE: MERCEDES_PROD

              run: |
                python scripts/04_load_used_car_snowflake.py

            # 6. LOAD MANUFACTURING DATA INTO SNOWFLAKE
            - name: Load manufacturing data
              env:
                SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
                SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_USER }}
                SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
                SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
                SNOWFLAKE_WAREHOUSE: LOAD_WH
                SNOWFLAKE_DATABASE: MERCEDES_PROD

              run: |
                python scripts/05_load_manufacturing_snowflake.py

            # 7. LOAD NHTSA INTO SNOWFLAKE
            - name: Load NHTSA into Snowflake
              env:
                SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
                SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_USER }}
                SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
                SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
                SNOWFLAKE_WAREHOUSE: LOAD_WH
                SNOWFLAKE_DATABASE: MERCEDES_PROD

              run: |
                python scripts/02_load_nhtsa_snowflake.py

            # 8. BUILD PRODUCTION ENVIRONMENT
            - name: Build Production Environment
              env:
                SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
                SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_USER }}
                SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
                SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
                SNOWFLAKE_WAREHOUSE: TRANSFORM_WH
                SNOWFLAKE_DATABASE: MERCEDES_PROD

              run: |
                python scripts/deploy_sql.py \
                    sql/deployment/02_deploy_prod.sql

            # 9. VALIDATE PRODUCTION
            - name: Validate Production
              env:
                SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
                SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_USER }}
                SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
                SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
                SNOWFLAKE_WAREHOUSE: TRANSFORM_WH
                SNOWFLAKE_DATABASE: MERCEDES_PROD

              run: |
                python tests/test_snowflake_production.py
                

                            
